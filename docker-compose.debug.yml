version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - cleanshop-network

  # CleanShop RestApi (Debug Mode - HTTP Only)
  cleanshop-api:
    build:
      context: .
      dockerfile: CleanShop 71 RestApi/Dockerfile
      target: build
    ports:
      - "5000:80"
      - "5002:5002" # Debug port
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CleanShopDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;MultipleActiveResultSets=true
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    volumes:
      - .:/src
      - /src/CleanShop 71 RestApi/bin
      - /src/CleanShop 71 RestApi/obj
    depends_on:
      - sqlserver
    networks:
      - cleanshop-network
    restart: unless-stopped
    command: dotnet watch run --urls=http://+:80

volumes:
  sqlserver_data:


networks:
  cleanshop-network:
    driver: bridge
